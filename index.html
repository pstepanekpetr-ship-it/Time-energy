<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binom</title>
<style>
  :root { color-scheme: light dark; }
  body {
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    gap: 24px;
    padding: 24px;
    box-sizing: border-box;
  }
  #langSwitch {
    position: absolute;
    top: 10px;
    right: 12px;
    display: flex;
    gap: 4px;
  }
  #langSwitch button {
    font-size: 1rem;
    background: none;
    border: none;
    padding: 2px;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0.4;
    line-height: 1;
  }
  #langSwitch button.active {
    opacity: 1;
    outline: 1.5px solid #888;
  }
  #genderFilter {
    display: flex;
    gap: 20px;
    justify-content: center;
    font-size: 1.1rem;
  }
  #genderFilter label {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  input[type="date"] {
    font-size: 1.2rem;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #888;
  }
  #result {
    font-size: 4rem;
    font-weight: 700;
    min-height: 1.2em;
  }
  hr {
    width: 100%;
    max-width: 320px;
    border: none;
    border-top: 1px solid #888;
  }
  #openPoint {
    text-align: center;
    line-height: 1.6;
  }
  #openPoint .meta {
    opacity: 0.7;
    font-size: 0.9rem;
  }
  #openPoint .row {
    font-size: 1.2rem;
  }
  .female { color: #ff69b4; }
  .male { color: #7ec8f2; }
  #diagrams {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .diagramCard {
    text-align: center;
  }
  .diagramCard .label {
    font-weight: 700;
    margin-bottom: 4px;
  }
  .fingerMeta {
    font-size: 0.8rem;
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .fingerImg {
    position: relative;
    width: 140px;
    overflow: hidden;
  }
  .fingerImg img {
    display: block;
    width: 100%;
    height: auto;
  }
  .fingerImg .pointCircle {
    position: absolute;
    width: 28px;
    height: 28px;
    margin-left: -14px;
    margin-top: -14px;
    border: 3px solid #e11d2e;
    border-radius: 50%;
    box-sizing: border-box;
  }
</style>
</head>
<body>
  <div id="langSwitch">
    <button type="button" data-lang="en">🇬🇧</button>
    <button type="button" data-lang="cs">🇨🇿</button>
  </div>

  <input type="date" id="dateInput">
  <div id="result"></div>

  <div id="genderFilter">
    <label><input type="radio" name="genderFilter" value="woman"> <span class="female">&#9792;</span></label>
    <label><input type="radio" name="genderFilter" value="man"> <span class="male">&#9794;</span></label>
  </div>

  <hr>

  <div id="openPoint"></div>
  <div id="diagrams"></div>

  <script src="binom.js"></script>
  <script src="openpoint.js"></script>
  <script src="fingerdiagram.js"></script>
  <script>
    const I18N = {
      en: {
        pragueTime: 'Prague time', heavenStem: 'heaven stem', meridian: 'meridian', active: 'active',
        summer: 'summer', winter: 'winter', point: 'point', onMeridian: 'on meridian', hand: 'hand',
        left: 'left', right: 'right', palmar: 'palmar', dorsal: 'dorsal', index: 'index', middle: 'middle', fingerWord: 'finger',
      },
      cs: {
        pragueTime: 'Pražský čas', heavenStem: 'nebeský kmen', meridian: 'meridián', active: 'aktivní',
        summer: 'letní', winter: 'zimní', point: 'bod', onMeridian: 'na meridiánu', hand: 'ruka',
        left: 'levá', right: 'pravá', palmar: 'dlaňová strana', dorsal: 'hřbetní strana', index: 'ukazovák', middle: 'prostředník', fingerWord: '',
      },
    };

    function detectLang() {
      const stored = localStorage.getItem('lang');
      if (stored) return stored;
      const primary = (navigator.language || '').toLowerCase();
      return primary.startsWith('cs') ? 'cs' : 'en';
    }

    let lang = detectLang();

    function handText(hand) {
      const t = I18N[lang];
      const side = hand === 'right' ? t.right : t.left;
      return `${side} ${t.hand}`;
    }

    function fingerCaption(info) {
      const t = I18N[lang];
      const aspect = info.aspectEn === 'palmar' ? t.palmar : t.dorsal;
      const finger = info.finger === 'index' ? t.index : t.middle;
      return t.fingerWord ? `${aspect} · ${finger} ${t.fingerWord}` : `${aspect} · ${finger}`;
    }

    const dateInput = document.getElementById('dateInput');
    const result = document.getElementById('result');
    const openPointEl = document.getElementById('openPoint');
    const diagramsEl = document.getElementById('diagrams');
    const langButtons = document.querySelectorAll('#langSwitch button');
    const genderRadios = document.querySelectorAll('#genderFilter input[type="radio"]');
    let genderFilter = null; // null = both, otherwise 'woman' or 'man'

    function renderAll() {
      langButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.lang === lang));

      if (!dateInput.value) {
        result.textContent = '';
        openPointEl.innerHTML = '';
        diagramsEl.innerHTML = '';
        return;
      }
      const t = I18N[lang];
      const [y, m, d] = dateInput.value.split('-').map(Number);
      result.textContent = getBinom(new Date(y, m - 1, d));

      const p = getOpenPointNow({ year: y, month: m, day: d });
      const organ = lang === 'cs' ? p.organCs : p.organ;
      const seasonWord = p.isSummer ? t.summer : t.winter;

      const womanHand = p.match === 'S' ? 'right' : 'left';
      const manHand = womanHand === 'right' ? 'left' : 'right';

      const rows = [];
      if (genderFilter !== 'man') {
        rows.push(`<div class="row"><span class="female">&#9792;</span> ${t.point} ${p.point} ${t.onMeridian} ${p.meridianLetter}, ${handText(womanHand)}</div>`);
      }
      if (genderFilter !== 'woman') {
        rows.push(`<div class="row"><span class="male">&#9794;</span> ${t.point} ${p.point} ${t.onMeridian} ${p.meridianLetter}, ${handText(manHand)}</div>`);
      }
      openPointEl.innerHTML = `
        <div class="meta">${t.pragueTime} ${p.pragueTime} (${seasonWord}) · ${t.heavenStem} ${p.heavenStem} · ${t.meridian} ${p.meridianLetter} – ${organ} · ${t.active} ${p.activeRange}</div>
        ${rows.join('')}
      `;

      function fingerCard(symbol, cssClass, info) {
        return `
          <div class="diagramCard">
            <div class="label"><span class="${cssClass}">${symbol}</span> (${handText(info.hand)})</div>
            <div class="fingerMeta">${fingerCaption(info)}</div>
            <div class="fingerImg">
              <img src="${info.image}" alt="${fingerCaption(info)}">
              <div class="pointCircle" style="left:${info.xPercent}%; top:${info.yPercent}%;"></div>
            </div>
          </div>
        `;
      }

      const cards = [];
      if (genderFilter !== 'man') {
        cards.push(fingerCard('&#9792;', 'female', getFingerDiagramInfo(p.meridianLetter, p.point, womanHand)));
      }
      if (genderFilter !== 'woman') {
        cards.push(fingerCard('&#9794;', 'male', getFingerDiagramInfo(p.meridianLetter, p.point, manHand)));
      }
      diagramsEl.innerHTML = cards.join('');
    }

    langButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        lang = btn.dataset.lang;
        localStorage.setItem('lang', lang);
        renderAll();
      });
    });

    genderRadios.forEach((radio) => {
      radio.addEventListener('click', () => {
        if (genderFilter === radio.value) {
          radio.checked = false;
          genderFilter = null;
        } else {
          genderFilter = radio.value;
        }
        renderAll();
      });
    });

    dateInput.addEventListener('input', renderAll);

    const today = new Date();
    dateInput.value = today.toISOString().slice(0, 10);
    renderAll();
    setInterval(renderAll, 1000);
  </script>
</body>
</html>
