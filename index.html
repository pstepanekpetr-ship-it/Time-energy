<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binom</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    gap: 24px;
    padding: 24px;
    box-sizing: border-box;
  }
  input[type="date"] {
    font-size: 1.2rem;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #888;
  }
  #result {
    font-size: 4rem;
    font-weight: 700;
    min-height: 1.2em;
  }
  hr {
    width: 100%;
    max-width: 320px;
    border: none;
    border-top: 1px solid #888;
  }
  #openPoint {
    text-align: center;
    line-height: 1.6;
  }
  #openPoint .meta {
    opacity: 0.7;
    font-size: 0.9rem;
  }
  #openPoint .row {
    font-size: 1.2rem;
  }
  #diagrams {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .diagramCard {
    text-align: center;
  }
  .diagramCard .label {
    font-weight: 700;
    margin-bottom: 4px;
  }
  .fingerImg {
    position: relative;
    width: 140px;
    overflow: hidden;
  }
  .fingerImg img {
    display: block;
    width: 100%;
    height: auto;
  }
  .fingerImg .pointCircle {
    position: absolute;
    width: 28px;
    height: 28px;
    margin-left: -14px;
    margin-top: -14px;
    border: 3px solid #e11d2e;
    border-radius: 50%;
    box-sizing: border-box;
  }
</style>
</head>
<body>
  <input type="date" id="dateInput">
  <div id="result"></div>

  <hr>

  <div id="openPoint"></div>
  <div id="diagrams"></div>

  <script src="binom.js"></script>
  <script src="openpoint.js"></script>
  <script src="fingerdiagram.js"></script>
  <script>
    const dateInput = document.getElementById('dateInput');
    const result = document.getElementById('result');
    const openPointEl = document.getElementById('openPoint');
    const diagramsEl = document.getElementById('diagrams');

    function renderAll() {
      if (!dateInput.value) {
        result.textContent = '';
        openPointEl.innerHTML = '';
        diagramsEl.innerHTML = '';
        return;
      }
      const [y, m, d] = dateInput.value.split('-').map(Number);
      result.textContent = getBinom(new Date(y, m - 1, d));

      const p = getOpenPointNow({ year: y, month: m, day: d });
      openPointEl.innerHTML = `
        <div class="meta">Prague time ${p.pragueTime} (${p.isSummer ? 'summer' : 'winter'}) · heaven stem ${p.heavenStem} · meridian ${p.meridianLetter} – ${p.organ} · active ${p.activeRange}</div>
        <div class="row">Woman: point ${p.point} on meridian ${p.meridianLetter}, ${p.woman}</div>
        <div class="row">Man: point ${p.point} on meridian ${p.meridianLetter}, ${p.man}</div>
      `;

      const womanHand = p.match === 'S' ? 'right' : 'left';
      const manHand = womanHand === 'right' ? 'left' : 'right';
      const womanInfo = getFingerDiagramInfo(p.meridianLetter, p.point, womanHand);
      const manInfo = getFingerDiagramInfo(p.meridianLetter, p.point, manHand);

      function fingerCard(label, info) {
        return `
          <div class="diagramCard">
            <div class="label">${label} (${info.hand} hand)</div>
            <div class="fingerImg">
              <img src="${info.image}" alt="${info.aspectEn} ${info.finger} finger">
              <div class="pointCircle" style="left:${info.xPercent}%; top:${info.yPercent}%;"></div>
            </div>
          </div>
        `;
      }

      diagramsEl.innerHTML = fingerCard('Woman', womanInfo) + fingerCard('Man', manInfo);
    }

    dateInput.addEventListener('input', renderAll);

    const today = new Date();
    dateInput.value = today.toISOString().slice(0, 10);
    renderAll();
    setInterval(renderAll, 1000);
  </script>
</body>
</html>
